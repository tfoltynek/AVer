{% load i18n %}
{% load lucide %}
<div class="Card InfoBox InfoBox--card" id="academic-fields-infobox">
  <p class="InfoBox-title">{% lucide 'book-open' size='14' %} {% translate "Academic fields" %}</p>
  <div class="InfoBox-content InfoBox-content--chips">
    {% for af in user.academic_fields.all %}
      <span class="Chip">{{ af|capfirst }}</span>
    {% empty %}
      <span class="InfoBox-empty">{% translate "No fields set." %}</span>
    {% endfor %}
  </div>
  <div class="InfoBox-actions">
    <button class="Button Button--ghost"
            hx-get="{% url 'update-academic-fields' %}"
            hx-target="body"
            hx-swap="afterbegin"
            hx-on::after-request="handleDialog()">{% lucide 'pencil' size='14' %} {% translate "Edit" %}</button>
  </div>
</div>
