{% load i18n %}
{% load lucide %}
<div class="Card InfoBox InfoBox--card" id="password-infobox">
  <p class="InfoBox-title">{% lucide 'lock' size='14' %} {% translate "Password" %}</p>
  <div class="InfoBox-content">
    <p class="InfoBox-content--password">••••••••</p>
    {% if just_updated %}
      <p class="InfoBox-success">{% lucide 'check' size='14' %} {% translate "Updated just now" %}</p>
    {% endif %}
  </div>
  <div class="InfoBox-actions">
    <button class="Button Button--ghost"
            hx-get="{% url 'change-password' %}"
            hx-target="body"
            hx-swap="afterbegin"
            hx-on::after-request="handleDialog()">{% lucide 'pencil' size='14' %} {% translate "Change" %}</button>
  </div>
</div>
