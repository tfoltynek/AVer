[pytest]
DJANGO_SETTINGS_MODULE = aver.settings
python_files = test_*.py *_test.py
# The suite is plain functions only -- no TestCase, no test classes. Leaving
# the default `Test*` class prefix on means pytest tries to collect the
# domain's `Test` model wherever a module imports it, so importing it used
# to require an alias. Collect no classes at all instead.
python_classes =
testpaths = tests/e2e tests/unit
addopts = --reuse-db
filterwarnings =
    ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
env =
    D:SECRET_KEY=e2e-not-secret
    D:DEBUG=True
    D:ALLOWED_HOSTS=localhost,127.0.0.1,testserver
    D:CSRF_TRUSTED_ORIGINS=http://localhost,http://127.0.0.1,http://testserver
    D:CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://testserver
    D:CELERY_BROKER_URL=memory://
    D:CELERY_RESULT_BACKEND=cache+memory://
    D:SCORE_INLINE=true
    D:DJANGO_ALLOW_ASYNC_UNSAFE=true
